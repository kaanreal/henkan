name: Publish to Package Managers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v1.2.3)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

      - name: Compute checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.tag }}"
          V="${VER#v}"
          checksum() {
            curl --fail --location --silent --show-error "$1" | sha256sum | cut -d' ' -f1
          }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(checksum "https://github.com/kaanreal/henkan/archive/refs/tags/$VER.tar.gz")" >> "$GITHUB_OUTPUT"
          echo "dmg_sha256=$(checksum "https://github.com/kaanreal/henkan/releases/download/$VER/Henkan_${V}_aarch64.dmg")" >> "$GITHUB_OUTPUT"
          echo "installer_sha256=$(checksum "https://github.com/kaanreal/henkan/releases/download/$VER/Henkan_${V}_x64-setup.exe")" >> "$GITHUB_OUTPUT"

      - name: Publish to Homebrew
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          packaging/ci-publish.sh homebrew \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.checksums.outputs.source_sha256 }}" \
            "${{ steps.checksums.outputs.dmg_sha256 }}" \
            "${{ steps.checksums.outputs.installer_sha256 }}"

      - name: Publish to Winget
        if: env.WINGET_GITHUB_TOKEN != ''
        env:
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          packaging/ci-publish.sh winget \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.checksums.outputs.source_sha256 }}" \
            "${{ steps.checksums.outputs.dmg_sha256 }}" \
            "${{ steps.checksums.outputs.installer_sha256 }}"

      - name: Publish to Chocolatey
        if: env.CHOCOLATEY_API_KEY != ''
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          packaging/ci-publish.sh choco \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.checksums.outputs.source_sha256 }}" \
            "${{ steps.checksums.outputs.dmg_sha256 }}" \
            "${{ steps.checksums.outputs.installer_sha256 }}"

      - name: Publish to AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          packaging/ci-publish.sh aur \
            "${{ steps.version.outputs.tag }}" \
            "${{ steps.checksums.outputs.source_sha256 }}" \
            "${{ steps.checksums.outputs.dmg_sha256 }}" \
            "${{ steps.checksums.outputs.installer_sha256 }}"
