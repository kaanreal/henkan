name: Release & Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (for example v1.7.0)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.policy.outputs.current }}
    steps:
      - name: Check whether this is the newest stable release
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          newest="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          echo "current=$([ "$RELEASE_TAG" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ github.event_name == 'release' || inputs.tag != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-name: linux-x86_64
            bundles: appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform-name: windows-x86_64
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            platform-name: darwin-aarch64
            bundles: dmg,app

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Create .env
        run: cp src-tauri/.env.example src-tauri/.env

      - run: npm ci

      - name: Install sse2neon header (macOS ARM64)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/sse2neon"
          curl -fsSL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o "$RUNNER_TEMP/sse2neon/sse2neon.h"
          echo "CXXFLAGS=-I$RUNNER_TEMP/sse2neon" >> "$GITHUB_ENV"
          echo "CFLAGS=-I$RUNNER_TEMP/sse2neon" >> "$GITHUB_ENV"

      - name: Build Tauri release
        run: npm run tauri build -- --features minacalc --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Rename artifacts for clean filenames
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          VERSION="${{ steps.version.outputs.version }}"

          case "${{ matrix.platform-name }}" in
            linux-x86_64) SHORT="linux" ;;
            windows-x86_64) SHORT="windows" ;;
            darwin-aarch64) SHORT="macos" ;;
          esac

          find "$BUNDLE_DIR" -type f -print0 | while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            new="$(echo "$base" | sed -E "s/^Henkan_${VERSION}_(amd64|x64|aarch64)/Henkan-v${VERSION}-${SHORT}/")"
            if [ "$SHORT" = "macos" ] && [ "$base" = "Henkan.app.tar.gz" ]; then
              new="Henkan-v${VERSION}-macos.app.tar.gz"
            fi
            if [ "$SHORT" = "macos" ] && [ "$base" = "Henkan.app.tar.gz.sig" ]; then
              new="Henkan-v${VERSION}-macos.app.tar.gz.sig"
            fi
            if [ "$base" != "$new" ]; then
              mv "$file" "$dir/$new"
            fi
          done

          echo "Renamed artifacts:"
          find "$BUNDLE_DIR" -type f | sort

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: henkan-${{ matrix.platform-name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle

  generate-updater-json:
    needs: [build]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Download all platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: henkan-*
          path: bundles

      - name: Create updater.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body -q .body > release-notes.md
          node scripts/generate-updater-manifest.mjs \
            --bundles bundles \
            --version "$VERSION" \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md \
            --output updater.json
          cat updater.json

      - name: Upload updater.json
        uses: actions/upload-artifact@v7
        with:
          name: updater-json
          path: updater.json

  publish:
    needs: [build, generate-updater-json]
    if: ${{ needs.build.result == 'success' && needs.generate-updater-json.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Download all platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: henkan-*
          path: bundles

      - name: Download updater.json
        uses: actions/download-artifact@v8
        with:
          name: updater-json
          path: .

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=$(find bundles -type f \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \))
          gh release upload "$RELEASE_TAG" updater.json $FILES --clobber

  sync-release-metadata:
    needs: [publish, release-policy]
    if: ${{ needs.publish.result == 'success' && needs.release-policy.outputs.current == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Synchronize release notes and package snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          checksum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }

          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body -q .body > release-notes.md

          RELEASE_DATE="${RELEASE_PUBLISHED_AT%%T*}"
          if [ -z "$RELEASE_DATE" ]; then RELEASE_DATE="$(date -u +%F)"; fi

          PREVIOUS_TAG=""
          while IFS= read -r candidate; do
            if [ "$candidate" != "$RELEASE_TAG" ] && [ "$(printf '%s\n' "$candidate" "$RELEASE_TAG" | sort -V | tail -n1)" = "$RELEASE_TAG" ]; then
              PREVIOUS_TAG="$candidate"
              break
            fi
          done < <(gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName,publishedAt --jq '.[].tagName' | sort -Vr)

          node scripts/sync-release-notes.mjs \
            --repository="${{ github.repository }}" \
            --version="$VERSION" \
            --tag="$RELEASE_TAG" \
            --previous-tag="$PREVIOUS_TAG" \
            --date="$RELEASE_DATE" \
            --notes-file=release-notes.md

          node scripts/sync-package-metadata.mjs \
            --version="$VERSION" \
            --sourceSha="$(checksum "https://github.com/${{ github.repository }}/archive/refs/tags/$RELEASE_TAG.tar.gz")" \
            --dmgSha="$(checksum "$RELEASE_URL/Henkan-v$VERSION-macos.dmg")" \
            --installerSha="$(checksum "$RELEASE_URL/Henkan-v$VERSION-windows-setup.exe")" \
            --appimageSha="$(checksum "$RELEASE_URL/Henkan-v$VERSION-linux.AppImage")" \
            --releaseDate="$RELEASE_DATE"

      - name: Commit synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md packaging/
          git diff --cached --quiet && exit 0
          git commit -m "🌸 sync release v${RELEASE_TAG#v}"
          git push origin HEAD:main
