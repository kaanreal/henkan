name: Release & Build

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing release tag to rebuild (e.g. v1.4.0). Leave empty for normal release."
                required: false
                type: string

concurrency:
    group: release-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release-please:
        if: ${{ !inputs.tag }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            body: ${{ steps.release.outputs.body }}
        steps:
            - uses: googleapis/release-please-action@v5
              id: release
              with:
                  token: ${{ secrets.MY_RELEASE_TOKEN }}
                  include-component-in-tag: false

    build:
        needs: [release-please]
        if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag) }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      platform-name: linux-x86_64
                      bundles: appimage
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      platform-name: windows-x86_64
                      bundles: nsis
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform-name: darwin-aarch64
                      bundles: dmg,app

        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Extract version
              id: version
              shell: bash
              env:
                  TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Patch version in tauri.conf.json and Cargo.toml
              shell: bash
              run: |
                  VER="${{ steps.version.outputs.version }}"
                  sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak
                  sed -i.bak "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml && rm -f src-tauri/Cargo.toml.bak

            - name: Install Rust
              run: |
                  rustup set profile minimal
                  rustup toolchain install stable
                  rustup default stable
                  rustup target add ${{ matrix.target }}

            - name: Install Linux deps
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

            - name: Create .env
              run: cp src-tauri/.env.example src-tauri/.env

            - run: npm ci

            - name: Install sse2neon header (macOS ARM64)
              if: matrix.os == 'macos-latest'
              run: |
                  mkdir -p "$RUNNER_TEMP/sse2neon"
                  curl -fsSL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o "$RUNNER_TEMP/sse2neon/sse2neon.h"
                  echo "CXXFLAGS=-I$RUNNER_TEMP/sse2neon" >> "$GITHUB_ENV"
                  echo "CFLAGS=-I$RUNNER_TEMP/sse2neon" >> "$GITHUB_ENV"

            - name: Build Tauri release
              run: npm run tauri build -- --features minacalc --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
              env:
                  APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

            - name: Rename artifacts for clean filenames
              shell: bash
              run: |
                  BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
                  VERSION="${{ steps.version.outputs.version }}"

                  case "${{ matrix.platform-name }}" in
                    linux-x86_64) SHORT="linux" ;;
                    windows-x86_64) SHORT="windows" ;;
                    darwin-aarch64) SHORT="macos" ;;
                  esac

                  find "$BUNDLE_DIR" -type f -print0 | while IFS= read -r -d '' file; do
                    dir="$(dirname "$file")"
                    base="$(basename "$file")"
                    new="$(echo "$base" | sed -E "s/^Henkan_${VERSION}_(amd64|x64|aarch64)/Henkan-v${VERSION}-${SHORT}/")"
                    if [ "$SHORT" = "macos" ] && [ "$base" = "Henkan.app.tar.gz" ]; then
                      new="Henkan-v${VERSION}-macos.app.tar.gz"
                    fi
                    if [ "$SHORT" = "macos" ] && [ "$base" = "Henkan.app.tar.gz.sig" ]; then
                      new="Henkan-v${VERSION}-macos.app.tar.gz.sig"
                    fi
                    if [ "$base" != "$new" ]; then
                      mv "$file" "$dir/$new"
                    fi
                  done

                  echo "Renamed artifacts:"
                  find "$BUNDLE_DIR" -type f | sort

            - name: Upload bundle artifact
              uses: actions/upload-artifact@v7
              with:
                  name: henkan-${{ matrix.platform-name }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle

    generate-updater-json:
        needs: [build, release-please]
        if: ${{ always() && needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Download all platform bundles
              uses: actions/download-artifact@v8
              with:
                  pattern: henkan-*
                  path: bundles

            - name: Create updater.json
              shell: bash
              env:
                  TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
                  GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # Embed the real markdown notes so the app never has to call the GitHub API at runtime
                  gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json body -q .body > release-notes.md
                  node scripts/generate-updater-manifest.mjs \
                    --bundles bundles \
                    --version "$VERSION" \
                    --tag "$TAG_NAME" \
                    --repo "${{ github.repository }}" \
                    --notes-file release-notes.md \
                    --output updater.json
                  cat updater.json

            - name: Upload updater.json
              uses: actions/upload-artifact@v7
              with:
                  name: updater-json
                  path: updater.json

    publish:
        needs: [build, generate-updater-json, release-please]
        if: ${{ always() && needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Download all platform bundles
              uses: actions/download-artifact@v8
              with:
                  pattern: henkan-*
                  path: bundles

            - name: Download updater.json
              uses: actions/download-artifact@v8
              with:
                  name: updater-json
                  path: .

            - name: Upload to Release
              env:
                  GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
              shell: bash
              run: |
                  TAG="${{ inputs.tag || needs.release-please.outputs.tag_name }}"
                  FILES=$(find bundles -type f \( -name '*.exe' -o -name '*.exe.sig' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \))
                  gh release upload "$TAG" updater.json $FILES --clobber

    publish-packages:
        needs: [publish, release-please]
        if: ${{ always() && needs.publish.result == 'success' }}
        uses: ./.github/workflows/publish-packages.yml
        with:
            version: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        secrets: inherit

    sync-package-metadata:
        needs: [publish, release-please]
        if: ${{ always() && needs.publish.result == 'success' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main

            - uses: actions/setup-node@v7
              with:
                  node-version: 22

            - name: Synchronize checked-in package snapshots
              shell: bash
              env:
                  TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  version="${TAG#v}"
                  release="https://github.com/${{ github.repository }}/releases/download/$TAG"
                  checksum() { curl -fsSL "$1" | sha256sum | cut -d' ' -f1; }
                  node scripts/sync-package-metadata.mjs \
                    --version="$version" \
                    --sourceSha="$(checksum "https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz")" \
                    --dmgSha="$(checksum "$release/Henkan-v$version-macos.dmg")" \
                    --installerSha="$(checksum "$release/Henkan-v$version-windows-setup.exe")" \
                    --appimageSha="$(checksum "$release/Henkan-v$version-linux.AppImage")" \
                    --releaseDate="$(date -u +%F)"

            - name: Commit synchronized metadata
              shell: bash
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add README.md packaging/
                  git diff --cached --quiet && exit 0
                  git commit -m "chore(packaging): sync release metadata [skip ci]"
                  git push
